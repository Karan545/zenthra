[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

# Optional local aliases
# ARC_TESTNET_RPC_URL can also be used via CLI: --rpc-url $ARC_TESTNET_RPC_URL
